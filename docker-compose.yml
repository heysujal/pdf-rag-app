services:
  redis:
    image: redis:8-alpine
    ports:
      - 6379:6379
    restart: always
    volumes:
      - redis-data:/data
  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
    volumes:
      - qdrant-data:/qdrant/storage
  server:
    build: ./server
    ports:
      - 3001:3001
    env_file:
      - ./server/.env
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - redis
      - qdrant
  worker:
    build: ./server
    command: node worker.js
    env_file:
      - ./server/.env
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - redis
      - qdrant

volumes:
  redis-data:
  qdrant-data:
  uploads-data: