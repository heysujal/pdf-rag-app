services:
  redis:
    image: redis:8-alpine
    ports:
      - 6379:6379
    restart: always
    volumes:
      - redis-data:/data
  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
    volumes:
      - qdrant-data:/qdrant/storage
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - 3001:3001
    env_file:
      - ./server/.env
    volumes:
      # Mount server code for hot-reload during development
      - ./server:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    command: npm run dev
    depends_on:
      - redis
      - qdrant
    environment:
      - REDIS_HOST=redis
      # QDRANT_URL will be read from .env file (supports both local and cloud URLs)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: npm run dev:worker
    env_file:
      - ./server/.env
    volumes:
      # Mount server code for hot-reload during development
      - ./server:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    depends_on:
      - redis
      - qdrant
      - server
    environment:
      - REDIS_HOST=redis
      # QDRANT_URL will be read from .env file (supports both local and cloud URLs)

volumes:
  redis-data:
  qdrant-data:
  uploads-data: